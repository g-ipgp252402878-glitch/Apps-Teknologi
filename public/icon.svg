<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="50%" stop-color="#2d6a4f"/>
      <stop offset="100%" stop-color="#40916c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe494"/>
      <stop offset="50%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#081c15" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background circle / badge -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="14" stroke-dasharray="16 10"/>
  
  <!-- Tree / Jungle canopy -->
  <path d="M 256 80 L 350 210 H 300 L 380 320 H 280 V 380 H 232 V 320 H 132 L 212 210 H 162 Z" fill="#52b788" filter="url(#shadow)"/>
  
  <!-- Animal Paw In Heart -->
  <g transform="translate(256, 310) scale(0.95)" filter="url(#shadow)">
    <!-- Main pad -->
    <ellipse cx="0" cy="0" rx="36" ry="28" fill="url(#gold)"/>
    <!-- Toes -->
    <circle cx="-35" cy="-30" r="14" fill="url(#gold)"/>
    <circle cx="-13" cy="-44" r="15" fill="url(#gold)"/>
    <circle cx="13" cy="-44" r="15" fill="url(#gold)"/>
    <circle cx="35" cy="-30" r="14" fill="url(#gold)"/>
  </g>

  <!-- Friendship Sparkles -->
  <polygon points="120,130 126,144 140,150 126,156 120,170 114,156 100,150 114,144" fill="#ffb703"/>
  <polygon points="380,120 385,133 398,138 385,143 380,156 375,143 362,138 375,133" fill="#ffe494"/>
  <polygon points="400,280 404,290 415,294 404,298 400,309 396,298 385,294 396,290" fill="#ffe494"/>
</svg>
